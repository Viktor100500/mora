name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify public source
        run: python3 scripts/check-publication.py --tree HEAD
      - name: Test publication guards
        run: python3 scripts/test-publication.py
      - name: Test Swift
        run: swift test
      - name: Check Python syntax
        run: python3 -m compileall -q scripts mcp cloud/shortcuts
