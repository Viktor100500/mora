name: MoraiOS
options:
  bundleIdPrefix: com.mora.finance
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  Mora:
    path: ..
# The development team and an optional bundle identifier come from Local.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "7"
    DEAD_CODE_STRIPPING: YES
targets:
  MoraiOS:
    type: application
    platform: iOS
    sources:
      - path: Mora
      # Platform-neutral application layer shared with the macOS app.
      - path: ../Sources/Mora/LedgerRepository.swift
        group: Shared
      - path: ../Sources/Mora/ChangeDescription.swift
        group: Shared
    dependencies:
      - package: Mora
        product: FinanceCore
    info:
      path: Mora/Info.plist
      properties:
        CFBundleDisplayName: Mora
        # Devices in other languages fall back to English; Russian is chosen by iOS.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ru, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Mora finds your Mac nearby to connect to the shared database.
        NSBonjourServices: [_mora-pair._tcp]
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text]
    settings:
      base:
        PRODUCT_NAME: Mora
        PRODUCT_MODULE_NAME: MoraiOS
        PRODUCT_BUNDLE_IDENTIFIER: $(MORA_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  MoraiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MoraTests]
    dependencies:
      - target: MoraiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(MORA_BUNDLE_IDENTIFIER).tests
        # The app's product name differs from its target name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mora.app/Mora
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  MoraiOS:
    build:
      targets:
        MoraiOS: all
        MoraiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MoraiOSTests]
