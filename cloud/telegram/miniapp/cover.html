<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mora · обложка Mini App</title>
<!-- Cover for the Mini App direct link in @BotFather (640x360), in Mora's colours
     (scripts/GenerateIcon.swift, Sources/Mora/LaunchScreen.swift). Render with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=640,360 --screenshot=cover.png cover.html -->
<style>
:root{--green:#336e57;--deep:#060e0b;--ivory:#e6f2e0;--leaf:#edf2de;--mint:#70b88f}
html,body{margin:0;width:640px;height:360px;overflow:hidden}
body{display:flex;align-items:center;gap:30px;padding:0 40px;box-sizing:border-box;color:var(--ivory);
  font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;
  background:radial-gradient(90% 120% at 78% 30%,#12301f 0%,#0b1d15 45%,var(--deep) 100%)}
.text{flex:1}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;letter-spacing:.2px}
h1{margin:22px 0 10px;font-size:36px;line-height:1.08;font-weight:700;letter-spacing:-.4px}
p{margin:0;font-size:17px;line-height:1.4;color:rgba(230,242,224,.72)}
.card{width:218px;flex:none;padding:18px 16px 16px;border-radius:20px;box-sizing:border-box;
  background:linear-gradient(160deg,rgba(237,242,222,.10),rgba(237,242,222,.04));
  border:1px solid rgba(112,184,143,.28);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:rgba(230,242,224,.55)}
.amount{margin:4px 0 14px;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.amount span{font-size:17px;font-weight:600;color:var(--mint);margin-left:4px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(230,242,224,.10);font-size:14px}
.row b{font-weight:600}
.row i{font-style:normal;color:rgba(230,242,224,.6)}
.button{margin-top:12px;padding:10px 0;border-radius:12px;text-align:center;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,#40826a,#2a5f4a);color:#fff}
</style>
</head>
<body>
<div class="text">
  <div class="brand">
    <svg viewBox="0 0 100 100" width="44" height="44" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#40826a"/><stop offset="1" stop-color="#1c4f3b"/></linearGradient></defs>
      <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#g)"/>
      <path d="M30 69C18 32 54 22 74 27C80 58 61 79 30 69Z" fill="#edf2de"/>
      <path d="M28 73C43 57 53 50 63 38" stroke="#336e57" stroke-width="2.7" stroke-linecap="round" fill="none"/>
    </svg>
    Mora
  </div>
  <h1>Новая трата<br>за пару касаний</h1>
  <p>Сумма, продавец и категория сразу попадают в общую базу Mora.</p>
</div>
<div class="card" aria-hidden="true">
  <div class="label">Сумма</div>
  <div class="amount">12,50<span>EUR</span></div>
  <div class="row"><i>Продавец</i><b>Lidl</b></div>
  <div class="row"><i>Категория</i><b>Продукты</b></div>
  <div class="row"><i>Счёт</i><b>Карта</b></div>
  <div class="button">Записать</div>
</div>
</body>
</html>
